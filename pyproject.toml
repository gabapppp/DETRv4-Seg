[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detrv4-seg"
version = "0.1.0"
description = "RT-DETRv4 fine-tuning with a P2 pyramid and ROI instance segmentation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10",
  "pycocotools>=2.0.8",
  "torch==2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
detector = ["torchvision==0.21.0", "PyYAML>=6", "scipy>=1.11", "faster-coco-eval>=1.6.5", "tensorboard>=2.16", "gdown>=5", "calflops>=0.3.2", "transformers>=4.40,<5"]

[project.scripts]
detrseg = "detrseg.cli:main"

[tool.setuptools.packages.find]
include = ["detrseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["vendor", ".venv", "runs"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
